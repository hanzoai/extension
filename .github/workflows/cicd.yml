# The one CI gate: the hanzoai/ci reusable runs hanzo.yml's `test:` list on a
# linux-amd64 runner. Every knob lives in /hanzo.yml, none here.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    secrets: inherit
