name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile

    - name: Build all packages
      run: pnpm run build
      continue-on-error: true

    - name: Run tests
      run: pnpm run test
      continue-on-error: true

  browser-extension:
    name: Browser Extension
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile

    - name: Build browser extension
      working-directory: packages/browser
      run: node src/build.js

    - name: Package Chrome
      working-directory: packages/browser
      run: cd dist/browser-extension/chrome && zip -r ../../../hanzo-ai-chrome.zip .

    - name: Package Firefox
      working-directory: packages/browser
      run: cd dist/browser-extension/firefox && zip -r ../../../hanzo-ai-firefox.zip .

    - name: Lint Firefox extension
      working-directory: packages/browser
      run: npx web-ext lint --source-dir dist/browser-extension/firefox
      continue-on-error: true

    - uses: actions/upload-artifact@v4
      with:
        name: browser-extensions
        path: |
          packages/browser/hanzo-ai-chrome.zip
          packages/browser/hanzo-ai-firefox.zip

  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile

    - name: Build VS Code extension
      run: pnpm --filter @hanzo/extension run compile
      continue-on-error: true

    - name: Package VSIX
      run: |
        pnpm add -g @vscode/vsce
        cd packages/vscode && vsce package --no-dependencies
      continue-on-error: true

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vscode-extension
        path: packages/vscode/*.vsix

  jetbrains-plugin:
    name: JetBrains Plugin
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/gradle-build-action@v2

    - name: Build plugin
      working-directory: packages/jetbrains
      run: ./gradlew buildPlugin
      continue-on-error: true

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jetbrains-plugin
        path: packages/jetbrains/build/distributions/*.zip

  safari-extension:
    name: Safari Extension
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile

    - name: Build browser extension
      working-directory: packages/browser
      run: node src/build.js

    - name: Build Safari macOS
      working-directory: packages/browser
      run: |
        xcodebuild -project "dist/safari/Hanzo AI/Hanzo AI.xcodeproj" \
          -scheme "Hanzo AI (macOS)" \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
          -derivedDataPath dist/safari-build-macos

    - name: Build Safari iOS
      working-directory: packages/browser
      run: |
        xcodebuild -project "dist/safari/Hanzo AI/Hanzo AI.xcodeproj" \
          -scheme "Hanzo AI (iOS)" \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
          -derivedDataPath dist/safari-build-ios

    - uses: actions/upload-artifact@v4
      with:
        name: safari-extension
        path: packages/browser/dist/safari/

  nightly-release:
    name: Nightly Release
    runs-on: ubuntu-latest
    needs: [build, browser-extension, vscode-extension, jetbrains-plugin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Generate build number
      id: buildnumber
      run: echo "build_number=$(date +'%Y%m%d.%H%M%S')" >> $GITHUB_OUTPUT

    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Nightly Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly-${{ steps.buildnumber.outputs.build_number }}
        name: Nightly Build ${{ steps.buildnumber.outputs.build_number }}
        prerelease: true
        files: |
          artifacts/vscode-extension/*.vsix
          artifacts/jetbrains-plugin/*.zip
          artifacts/browser-extensions/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
