name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build All Extensions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile

    # ── Browser (Chrome + Firefox) ──
    - name: Build browser extension
      working-directory: packages/browser
      run: node src/build.js

    - name: Package Chrome
      working-directory: packages/browser
      run: cd dist/browser-extension/chrome && zip -r ../../../dist/hanzo-ai-chrome.zip .

    - name: Package Firefox
      working-directory: packages/browser
      run: cd dist/browser-extension/firefox && zip -r ../../../dist/hanzo-ai-firefox.zip .

    - name: Lint Firefox
      working-directory: packages/browser
      run: npx web-ext lint --source-dir dist/browser-extension/firefox
      continue-on-error: true

    # ── VS Code ──
    - name: Build VS Code extension
      run: pnpm --filter @hanzo/extension run compile
      continue-on-error: true

    - name: Package VSIX
      run: |
        pnpm add -g @vscode/vsce
        cd packages/vscode && vsce package --no-dependencies -o dist/
      continue-on-error: true

    # ── DXT (Claude Code) ──
    - name: Build DXT extension
      run: pnpm --filter @hanzo/dxt run build
      continue-on-error: true

    # ── MCP ──
    - name: Build MCP server
      run: pnpm --filter @hanzo/mcp run build
      continue-on-error: true

    # ── Upload all artifacts ──
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dist
        path: |
          packages/browser/dist/hanzo-ai-chrome.zip
          packages/browser/dist/hanzo-ai-firefox.zip
          packages/vscode/dist/*.vsix
          packages/dxt/dist/*.dxt
          packages/mcp/dist/

  build-safari:
    name: Build Safari (macOS + iOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile

    - name: Build browser extension
      working-directory: packages/browser
      run: node src/build.js

    - name: Build Safari macOS
      working-directory: packages/browser
      run: |
        xcodebuild -project "dist/safari/Hanzo AI/Hanzo AI.xcodeproj" \
          -scheme "Hanzo AI (macOS)" \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
          -derivedDataPath dist/safari-build-macos

    - name: Build Safari iOS
      working-directory: packages/browser
      run: |
        xcodebuild -project "dist/safari/Hanzo AI/Hanzo AI.xcodeproj" \
          -scheme "Hanzo AI (iOS)" \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
          -derivedDataPath dist/safari-build-ios

    - uses: actions/upload-artifact@v4
      with:
        name: safari
        path: packages/browser/dist/safari/

  build-jetbrains:
    name: Build JetBrains Plugin
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/gradle-build-action@v2

    - name: Build plugin
      working-directory: packages/jetbrains
      run: ./gradlew buildPlugin
      continue-on-error: true

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: jetbrains
        path: packages/jetbrains/build/distributions/*.zip
