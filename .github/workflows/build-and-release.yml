name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile

    - name: Build all packages
      run: pnpm run build
      continue-on-error: true

    - name: Build VS Code Extension
      run: |
        pnpm add -g @vscode/vsce
        cd packages/vscode && vsce package --no-dependencies
      continue-on-error: true

    - name: Build browser extension
      working-directory: packages/browser
      run: |
        node src/build.js
        cd dist/browser-extension/chrome && zip -r ../../../hanzo-ai-chrome.zip .
        cd ../../firefox && zip -r ../../../hanzo-ai-firefox.zip .

    - uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          packages/vscode/*.vsix
          packages/browser/hanzo-ai-chrome.zip
          packages/browser/hanzo-ai-firefox.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: artifacts

    - name: Get version
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release v${{ steps.get_version.outputs.VERSION }}
        files: |
          artifacts/**/*.vsix
          artifacts/**/*.zip
        body: |
          # Hanzo AI Extension v${{ steps.get_version.outputs.VERSION }}

          ## Installation

          ### VS Code
          Download `.vsix` and install via `code --install-extension <file>.vsix`

          ### Chrome
          Upload `hanzo-ai-chrome.zip` or install from Chrome Web Store

          ### Firefox
          Upload `hanzo-ai-firefox.zip` or install from Firefox Add-ons
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
