name: Publish Extensions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.5.8)'
        required: true
        type: string

# Use Hanzo self-hosted runners when available, fall back to GitHub-hosted
# To use Hanzo PaaS runners, set HANZO_RUNNER label in repo settings
# and change runs-on to: [self-hosted, hanzo, macos] or [self-hosted, hanzo, linux]

jobs:
  # ─────────────────────────────────────────────────
  # Chrome + Firefox (Linux runner)
  # ─────────────────────────────────────────────────
  publish-browser:
    name: Build & Publish Chrome + Firefox
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile

    - name: Build browser extension
      working-directory: packages/browser
      run: node src/build.js

    - name: Package Chrome
      working-directory: packages/browser
      run: cd dist/browser-extension/chrome && zip -r ../../../hanzo-ai-chrome.zip .

    - name: Package Firefox
      working-directory: packages/browser
      run: cd dist/browser-extension/firefox && zip -r ../../../hanzo-ai-firefox.zip .

    - name: Lint Firefox extension
      working-directory: packages/browser
      run: npx web-ext lint --source-dir dist/browser-extension/firefox

    # --- Chrome Web Store ---
    - name: Publish to Chrome Web Store
      if: secrets.CHROME_EXTENSION_ID != ''
      working-directory: packages/browser
      run: |
        ACCESS_TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
          -d "client_id=${{ secrets.CHROME_CLIENT_ID }}" \
          -d "client_secret=${{ secrets.CHROME_CLIENT_SECRET }}" \
          -d "refresh_token=${{ secrets.CHROME_REFRESH_TOKEN }}" \
          -d "grant_type=refresh_token" | jq -r '.access_token')
        curl -s -X PUT \
          "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "x-goog-api-version: 2" \
          -T hanzo-ai-chrome.zip
        curl -s -X POST \
          "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}/publish" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "x-goog-api-version: 2" \
          -H "Content-Length: 0"
      continue-on-error: true

    # --- Firefox Add-ons ---
    - name: Publish to Firefox Add-ons
      if: secrets.AMO_API_KEY != ''
      working-directory: packages/browser
      run: |
        npx web-ext sign \
          --source-dir dist/browser-extension/firefox \
          --api-key "${{ secrets.AMO_API_KEY }}" \
          --api-secret "${{ secrets.AMO_API_SECRET }}" \
          --channel listed \
          --id "hanzo-ai@hanzo.ai"
      continue-on-error: true

    - uses: actions/upload-artifact@v4
      with:
        name: browser-extensions
        path: |
          packages/browser/hanzo-ai-chrome.zip
          packages/browser/hanzo-ai-firefox.zip

  # ─────────────────────────────────────────────────
  # Safari macOS + iOS (macOS runner required)
  # ─────────────────────────────────────────────────
  publish-safari:
    name: Build Safari (macOS + iOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile

    - name: Build browser extension
      working-directory: packages/browser
      run: node src/build.js

    - name: Build Safari macOS
      working-directory: packages/browser
      run: |
        xcodebuild -project "dist/safari/Hanzo AI/Hanzo AI.xcodeproj" \
          -scheme "Hanzo AI (macOS)" \
          -configuration Release \
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
          -derivedDataPath dist/safari-build-macos

    - name: Build Safari iOS
      working-directory: packages/browser
      run: |
        xcodebuild -project "dist/safari/Hanzo AI/Hanzo AI.xcodeproj" \
          -scheme "Hanzo AI (iOS)" \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
          -derivedDataPath dist/safari-build-ios

    - uses: actions/upload-artifact@v4
      with:
        name: safari-extension
        path: |
          packages/browser/dist/safari/

  # ─────────────────────────────────────────────────
  # VS Code Marketplace
  # ─────────────────────────────────────────────────
  publish-vscode:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm add -g @vscode/vsce ovsx
    - run: pnpm --filter @hanzo/extension run compile
    - name: Package and publish
      working-directory: packages/vscode
      run: |
        vsce package --no-dependencies
        vsce publish -p ${{ secrets.VSCE_PAT }}
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
    - name: Publish to Open VSX
      working-directory: packages/vscode
      run: ovsx publish *.vsix -p ${{ secrets.OVSX_PAT }}
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      continue-on-error: true

  # ─────────────────────────────────────────────────
  # npm (@hanzo/mcp)
  # ─────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'
    - run: pnpm install --frozen-lockfile
    - run: pnpm --filter @hanzo/mcp run build
    - name: Publish @hanzo/mcp
      working-directory: packages/mcp
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      continue-on-error: true

  # ─────────────────────────────────────────────────
  # JetBrains Marketplace
  # ─────────────────────────────────────────────────
  publish-jetbrains:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/gradle-build-action@v2
    - name: Build and publish
      working-directory: packages/jetbrains
      run: ./gradlew publishPlugin
      env:
        PUBLISH_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
      continue-on-error: true
