name: Publish Extensions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.5.8)'
        required: true
        type: string

jobs:
  publish-vscode:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm add -g @vscode/vsce ovsx
    - run: pnpm --filter @hanzo/extension run compile
    - name: Package and publish to VS Code Marketplace
      working-directory: packages/vscode
      run: |
        vsce package --no-dependencies
        vsce publish -p ${{ secrets.VSCE_PAT }}
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
    - name: Publish to Open VSX
      working-directory: packages/vscode
      run: ovsx publish *.vsix -p ${{ secrets.OVSX_PAT }}
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}
      continue-on-error: true

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'
    - run: pnpm install --frozen-lockfile
    - run: pnpm --filter @hanzo/mcp run build
    - name: Publish @hanzo/mcp
      working-directory: packages/mcp
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      continue-on-error: true

  publish-jetbrains:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/gradle-build-action@v2
    - name: Build and publish plugin
      working-directory: packages/jetbrains
      run: ./gradlew publishPlugin
      env:
        PUBLISH_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
      continue-on-error: true

  publish-browser:
    name: Publish Browser Extensions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile

    - name: Build browser extension
      working-directory: packages/browser
      run: node src/build.js

    - name: Package Chrome extension
      working-directory: packages/browser
      run: cd dist/browser-extension/chrome && zip -r ../../../hanzo-ai-chrome.zip .

    - name: Package Firefox extension
      working-directory: packages/browser
      run: cd dist/browser-extension/firefox && zip -r ../../../hanzo-ai-firefox.zip .

    # --- Chrome Web Store ---
    - name: Publish to Chrome Web Store
      if: ${{ secrets.CHROME_EXTENSION_ID != '' }}
      working-directory: packages/browser
      run: |
        # Get access token from refresh token
        ACCESS_TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
          -d "client_id=${{ secrets.CHROME_CLIENT_ID }}" \
          -d "client_secret=${{ secrets.CHROME_CLIENT_SECRET }}" \
          -d "refresh_token=${{ secrets.CHROME_REFRESH_TOKEN }}" \
          -d "grant_type=refresh_token" | jq -r '.access_token')

        # Upload new version
        curl -s -X PUT \
          "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "x-goog-api-version: 2" \
          -T hanzo-ai-chrome.zip

        # Publish
        curl -s -X POST \
          "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.CHROME_EXTENSION_ID }}/publish" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "x-goog-api-version: 2" \
          -H "Content-Length: 0"

        echo "Published to Chrome Web Store"
      continue-on-error: true

    # --- Firefox Add-ons (AMO) ---
    - name: Publish to Firefox Add-ons
      if: ${{ secrets.AMO_API_KEY != '' }}
      working-directory: packages/browser
      run: |
        npx web-ext sign \
          --source-dir dist/browser-extension/firefox \
          --api-key "${{ secrets.AMO_API_KEY }}" \
          --api-secret "${{ secrets.AMO_API_SECRET }}" \
          --channel listed \
          --id "hanzo-ai@hanzo.ai"
      continue-on-error: true

    # Upload artifacts for manual fallback
    - uses: actions/upload-artifact@v4
      with:
        name: browser-extensions
        path: |
          packages/browser/hanzo-ai-chrome.zip
          packages/browser/hanzo-ai-firefox.zip
