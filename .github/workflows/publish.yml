# Native store-publish — Hanzo Git act_runner (label linux-amd64).
# This is the SYSTEM OF RECORD for publishing the browser extension to the
# Chrome Web Store + Firefox AMO, hanzo-ide to the VS Code Marketplace + Open
# VSX, and for the npm package. GitHub only mirrors.
#
# Secrets model — KMS ONLY. The single bootstrap credential is the KMS machine
# identity (KMS_CLIENT_ID / KMS_CLIENT_SECRET, a git.hanzo.ai Actions secret).
# Every store credential is pulled from KMS at publish time
# (org `hanzo`, env `prod`, path `/extension-publish` — see
# deploy/kms/extension-publish-kms-sync.yaml). No store or npm secret is ever
# stored in GitHub or Gitea Actions secrets.
#
# amd64/Linux only. Safari (macOS) + Windows desktop stay on GitHub-hosted
# runners until native macOS/Windows act_runners are green
# (runners-act-migration.md Phase 2).
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialized, newest wins. Two builds in flight both ask npm before either
# uploads, so both read the same version as unpublished and the slower one
# submits a stale zip under a version the store will not let it replace.
concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    # On the runner itself: it has the docker CLI and no daemon, so a
    # `container:` job dies before its first step. jq and curl are in its image.
    runs-on: [linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # uv, because packages/jupyter builds through uvx.
      - name: Tools (pnpm, uv)
        shell: bash
        run: |
          corepack enable
          command -v uv >/dev/null 2>&1 || {
            curl -fsSL https://astral.sh/uv/install.sh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          }
      - run: pnpm install --frozen-lockfile

      # ── The ONE secret hop: KMS machine identity → store creds ──
      # Login once, read each key from hanzo:/extension-publish, mask + export.
      # A missing key exports empty; each publish step below gates on its creds,
      # so partial provisioning publishes exactly what KMS has.
      - name: Is this version already published
        id: ahead
        # Before the credential read, so an ordinary push costs nothing and
        # asks KMS for nothing. The stores are the reason this gate exists at
        # all: npm skips a version it already has, but a store upload of one
        # it already has is a rejection, so without this every push that did
        # not bump the version would fail on a duplicate.
        run: |
          NEW=$(node -p "require('./packages/browser/package.json').version")
          OLD=$(curl -sf "https://registry.npmjs.org/@hanzo%2fbrowser-extension" \
                  | jq -r '."dist-tags".latest // "0.0.0"' 2>/dev/null || echo "0.0.0")
          NEWEST=$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)
          if [ "$OLD" = "$NEW" ] || [ "$NEWEST" != "$NEW" ]; then
            echo "npm serves $OLD; tree is $NEW — nothing to ship."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          else
            echo "npm serves $OLD; tree is $NEW — shipping."
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi

      # The same question for hanzo-ide, asked of each store's public API: the
      # Marketplace gallery query and the Open VSX registry. Each refuses a
      # version it already has, so each ships only when it lacks this one.
      - name: Is hanzo-ide already on the VS Code stores
        id: ide
        run: |
          NEW=$(node -p "require('./packages/vscode/package.json').version")
          MARKETPLACE=$(curl -sf -X POST "https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery" \
                  -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=3.0-preview.1' \
                  -d '{"filters":[{"criteria":[{"filterType":7,"value":"hanzo-ai.hanzo-ide"}]}],"flags":1}' \
                  | jq -r '.results[0].extensions[0].versions[]?.version' 2>/dev/null | sort -V | tail -1)
          OPENVSX=$(curl -sf "https://open-vsx.org/api/hanzo-ai/hanzo-ide" | jq -r '.version // empty' 2>/dev/null || true)
          yes=false
          for pair in "marketplace:${MARKETPLACE:-0.0.0}" "openvsx:${OPENVSX:-0.0.0}"; do
            store=${pair%%:*}; OLD=${pair#*:}
            NEWEST=$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)
            if [ "$OLD" = "$NEW" ] || [ "$NEWEST" != "$NEW" ]; then
              echo "$store serves $OLD; tree is $NEW — nothing to ship."
              echo "$store=false" >> "$GITHUB_OUTPUT"
            else
              echo "$store serves $OLD; tree is $NEW — shipping."
              echo "$store=true" >> "$GITHUB_OUTPUT"
              yes=true
            fi
          done
          echo "yes=$yes" >> "$GITHUB_OUTPUT"

      # What ships is what was checked: `make check` is the CI gate (hanzo.yml),
      # and the build it makes is the one the stores and npm get. Before the
      # credential read, so a release that fails here asks KMS for nothing and
      # uploads nothing.
      - name: Build and check the release
        id: check
        if: steps.ahead.outputs.yes == 'true' || steps.ide.outputs.yes == 'true'
        run: make check

      - name: Load publish credentials from KMS
        if: steps.ahead.outputs.yes == 'true' || steps.ide.outputs.yes == 'true'
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
          # Where each credential lives. NPM_TOKEN is at the org root, so its
          # path is empty; the store credentials have a path of their own. Set
          # either variable to move a credential without editing this file.
          KMS_NPM_PATH: ${{ vars.KMS_NPM_PATH || '' }}
          KMS_STORE_PATH: ${{ vars.KMS_STORE_PATH || 'extension-publish' }}
        run: |
          # Fail rather than export nothing. Every publish step below gates on
          # `env.<CRED> != ''`, so an absent identity would skip all of them and
          # the job would finish green having shipped nothing.
          if [ -z "$KMS_CLIENT_ID" ] || [ -z "$KMS_CLIENT_SECRET" ]; then
            echo "::error::KMS machine identity absent. Seed KMS_CLIENT_ID/KMS_CLIENT_SECRET as git.hanzo.ai Actions secrets (org or repo scope)."
            exit 1
          fi
          TOKEN=$(curl -fsS "$KMS_ENDPOINT/v1/kms/auth/login" -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"$KMS_CLIENT_ID\",\"clientSecret\":\"$KMS_CLIENT_SECRET\"}" \
            | jq -r '.accessToken // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::KMS login failed at $KMS_ENDPOINT/v1/kms/auth/login (check KMS_CLIENT_ID/KMS_CLIENT_SECRET)."
            exit 1
          fi
          # Flat form, answering {name, env, value} — the contract cloud's
          # embedded KMS serves, and the same read @hanzo/ui and @hanzo/logo use.
          # The read is org-scoped by the token's owner claim, so the org is not
          # a path segment.
          for spec in "$KMS_STORE_PATH:CHROME_EXTENSION_ID" "$KMS_STORE_PATH:CHROME_CLIENT_ID" \
                      "$KMS_STORE_PATH:CHROME_CLIENT_SECRET" "$KMS_STORE_PATH:CHROME_REFRESH_TOKEN" \
                      "$KMS_STORE_PATH:AMO_API_KEY" "$KMS_STORE_PATH:AMO_API_SECRET" \
                      "$KMS_STORE_PATH:VSCE_PAT" "$KMS_STORE_PATH:OVSX_PAT" \
                      "$KMS_NPM_PATH:NPM_TOKEN"; do
            KEYPATH=${spec%:*}; KEY=${spec##*:}
            # No -f: a 404 must report WHICH key was empty, not just exit 22.
            VAL=$(curl -sS "$KMS_ENDPOINT/v1/kms/secrets/${KEYPATH:+$KEYPATH/}$KEY?env=$KMS_SECRET_ENV" \
              -H "Authorization: Bearer $TOKEN" | jq -r '.value // empty')
            if [ -n "$VAL" ]; then echo "::add-mask::$VAL"; fi
            echo "$KEY=$VAL" >> "$GITHUB_ENV"
          done

      - name: Package (web-ext — no zip binary on the runner)
        if: steps.ahead.outputs.yes == 'true'
        working-directory: packages/browser
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npx web-ext build --source-dir ../../dist/chrome  --artifacts-dir ../../dist --filename hanzo-ai-chrome-v${VERSION}.zip  --overwrite-dest
          npx web-ext build --source-dir ../../dist/firefox --artifacts-dir ../../dist --filename hanzo-ai-firefox-v${VERSION}.zip --overwrite-dest

      - name: Publish to Chrome Web Store
        if: steps.ahead.outputs.yes == 'true' && env.CHROME_EXTENSION_ID != ''
        working-directory: packages/browser
        run: |
          ACCESS_TOKEN=$(curl -s -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=$CHROME_CLIENT_ID" -d "client_secret=$CHROME_CLIENT_SECRET" \
            -d "refresh_token=$CHROME_REFRESH_TOKEN" -d "grant_type=refresh_token" | jq -r '.access_token')
          VERSION=$(node -p "require('./package.json').version")
          curl -sf -X PUT "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CHROME_EXTENSION_ID" \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "x-goog-api-version: 2" \
            -T ../../dist/hanzo-ai-chrome-v${VERSION}.zip
          curl -sf -X POST "https://www.googleapis.com/chromewebstore/v1.1/items/$CHROME_EXTENSION_ID/publish" \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "x-goog-api-version: 2" -H "Content-Length: 0"

      - name: Publish to Firefox Add-ons
        if: steps.ahead.outputs.yes == 'true' && env.AMO_API_KEY != ''
        working-directory: packages/browser
        run: |
          npx web-ext sign --source-dir ../../dist/firefox \
            --api-key "$AMO_API_KEY" --api-secret "$AMO_API_SECRET" \
            --channel listed --id "hanzo-ai@hanzo.ai"

      # The .vsix `make check` built: packages/vscode's `build` is
      # `vsce package --no-dependencies`, so both stores get that one package.
      # vsce reads VSCE_PAT and ovsx reads OVSX_PAT from the environment.
      - name: Publish hanzo-ide to the VS Code Marketplace
        if: steps.ide.outputs.marketplace == 'true' && env.VSCE_PAT != ''
        working-directory: packages/vscode
        run: pnpm exec vsce publish --packagePath dist/hanzo-ide.vsix

      - name: Publish hanzo-ide to Open VSX
        if: steps.ide.outputs.openvsx == 'true' && env.OVSX_PAT != ''
        working-directory: packages/vscode
        run: npx --yes ovsx@1.2.0 publish dist/hanzo-ide.vsix

      # npm — the canonical and only home for these packages. Every package was
      # built by `make check` above. pnpm publish skips a version already on the
      # registry, so re-running is idempotent. A single package the registry
      # refuses must not strand the others, so a per-package failure is
      # tolerated here and the registry check below is what decides whether the
      # release actually shipped.
      - name: Publish @hanzo/* to npm
        if: steps.ahead.outputs.yes == 'true' && env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
          echo "@hanzo:registry=https://registry.npmjs.org/" >> .npmrc
          pnpm -r publish --access public --no-git-checks --ignore-scripts --report-summary || true

      # Ask the registry, because the registry is the only thing that knows.
      # Without this a tolerated publish failure reads exactly like a success,
      # which is the one way this job can lie.
      - name: npm serves what the tree declares
        if: steps.ahead.outputs.yes == 'true' && env.NPM_TOKEN != ''
        run: |
          VERSION=$(node -p "require('./packages/browser/package.json').version")
          n=0
          while [ "$n" -lt 10 ]; do
            if curl -fsS "https://registry.npmjs.org/@hanzo%2fbrowser-extension/$VERSION" >/dev/null 2>&1; then
              echo "npm serves @hanzo/browser-extension@$VERSION"
              exit 0
            fi
            n=$((n + 1))
            sleep 6
          done
          echo "::error::npm does not serve @hanzo/browser-extension@$VERSION — the publish did not land."
          exit 1

      # Say what actually shipped. Each publish step above is gated on its own
      # credential so partial provisioning ships exactly what KMS has; this step
      # names which targets that was, so a skipped store is legible rather than
      # silent, and fails the job if a release published nowhere at all.
      # The VS Code stores wait on their owner (packages/vscode/LLM.md), so one
      # without its token is a notice, never a failure.
      - name: Publish summary
        if: always() && (steps.ahead.outputs.yes == 'true' || steps.ide.outputs.yes == 'true')
        run: |
          if [ "${{ steps.check.outcome }}" != "success" ]; then
            echo "::error::the release checks failed, so nothing was uploaded"
            exit 1
          fi
          for spec in "VSCE_PAT:VS Code Marketplace:${{ steps.ide.outputs.marketplace }}" \
                      "OVSX_PAT:Open VSX:${{ steps.ide.outputs.openvsx }}"; do
            key=${spec%%:*}; rest=${spec#*:}; label=${rest%:*}
            [ "${rest##*:}" = "true" ] || continue
            eval "val=\$$key"
            if [ -n "$val" ]; then
              echo "published -> $label"
            else
              echo "::notice::SKIPPED $label: no $key in KMS at hanzo:/extension-publish (owner steps in packages/vscode/LLM.md)"
            fi
          done
          [ "${{ steps.ahead.outputs.yes }}" = "true" ] || exit 0
          shipped=0
          for pair in "CHROME_EXTENSION_ID:Chrome Web Store" "AMO_API_KEY:Firefox Add-ons" "NPM_TOKEN:npm"; do
            key=${pair%%:*}; label=${pair#*:}
            eval "val=\$$key"
            if [ -n "$val" ]; then
              echo "published -> $label"
              shipped=$((shipped + 1))
            else
              echo "SKIPPED   -> $label (no credential in KMS at hanzo:/extension-publish)"
            fi
          done
          if [ "$shipped" -eq 0 ]; then
            echo "::error::this tag published NOWHERE — every target lacked a credential"
            exit 1
          fi
