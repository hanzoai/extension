# Native CI — Hanzo Git act_runners (label hanzo-build-linux-amd64).
# amd64 test + build gate; mirrors the amd64 lanes of .github/workflows/ci.yml.
# The macOS (Safari) and cross-platform Playwright matrix stay on GitHub-hosted
# runners until native macOS/Windows act_runners are green
# (runners-act-migration.md Phase 2). act_runner reads this unmodified;
# GitHub.com ignores .hanzo/workflows, so the GitHub release lanes are untouched.
name: ci

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: hanzo-build-linux-amd64
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      # Shared workspace lib first — consumers import its built dist/.
      - run: pnpm --filter @hanzo/cards build
      - run: pnpm --filter @hanzo/browser-extension test
      - run: pnpm --filter @hanzo/aci test
      - run: pnpm --filter @hanzo/auth test
      # hanzo-ide's `test` script drives the VS Code integration harness, which
      # needs a display; `test:vitest` is the plain-node suite. It is here for
      # iam-paths.test.ts, which holds the extension's hand-copied IAM path
      # prefix equal to @hanzo/iam's. That guard is the reason the copy is
      # allowed to exist, so it has to actually run.
      - run: pnpm --filter hanzo-ide test:vitest

  build:
    runs-on: hanzo-build-linux-amd64
    container: node:22-bookworm
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Build browser extension
        working-directory: packages/browser
        run: node src/build.js

      # Armed: over budget fails the build. The previous form pointed at a path
      # the build stopped writing and carried continue-on-error, so it measured
      # nothing and reported nothing.
      - name: Check bundle budgets
        working-directory: packages/browser
        run: pnpm run check:bundle-budget
